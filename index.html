<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-container">
    <section aria-labelledby="titulo-login">
      <form id="loginForm" novalidate aria-describedby="ayuda-login">
        <header>
          <h1 id="titulo-login">Iniciar sesión</h1>
          <p id="ayuda-login" class="ayuda">Accede con tu correo y contraseña para continuar. Uso didáctico, sin autenticación real.</p>
        </header>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="usuario@ejemplo.com" required autocomplete="email" aria-required="true" aria-describedby="ayuda-login">
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="********" required autocomplete="current-password" aria-required="true">
          <button type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña">Mostrar</button>
        </div>

        <p id="mensaje" role="alert" aria-live="polite"></p>

        <button type="submit">Ingresar</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
